plugins { id 'com.android.application' }

def myAdvKeystorePath = System.getenv('MYADV_KEYSTORE_FILE')
def myAdvStorePassword = System.getenv('MYADV_STORE_PASSWORD')
def myAdvKeyAlias = System.getenv('MYADV_KEY_ALIAS')
def myAdvKeyPassword = System.getenv('MYADV_KEY_PASSWORD')
def myAdvSigningReady = myAdvKeystorePath && file(myAdvKeystorePath).isFile() &&
        myAdvStorePassword && myAdvKeyAlias && myAdvKeyPassword

android {
    namespace 'org.myoffice.app'
    compileSdk 35
    defaultConfig {
        applicationId 'org.myoffice.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (myAdvSigningReady) {
        signingConfigs {
            myAdv {
                storeFile file(myAdvKeystorePath)
                storePassword myAdvStorePassword
                keyAlias myAdvKeyAlias
                keyPassword myAdvKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            if (myAdvSigningReady) {
                signingConfig signingConfigs.myAdv
            }
            minifyEnabled false
        }
    }
}
