plugins { id 'com.android.application' }

android {
    namespace 'org.myoffice.app'
    compileSdk 35
    defaultConfig {
        applicationId 'org.myoffice.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    signingConfigs {
        release {
            def keyPath = System.getenv('MYADV_KEYSTORE_PATH')
            if (keyPath != null && !keyPath.isEmpty()) {
                storeFile file(keyPath)
                storePassword System.getenv('MYADV_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MYADV_KEY_ALIAS')
                keyPassword System.getenv('MYADV_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('MYADV_KEYSTORE_PATH') != null && !System.getenv('MYADV_KEYSTORE_PATH').isEmpty()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
